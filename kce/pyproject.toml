[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kce"
version = "0.1.0"
description = "Keyword-guided Cue Encoder for DAE-TSE"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kce*"]
