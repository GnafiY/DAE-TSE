[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wesep"
version = "0.1.0"
description = "DAE-TSE paper inference and whole-utterance training"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "PyYAML",
    "soundfile",
    "fire",
    "tqdm",
    "g2p_en",
]

[tool.setuptools.packages.find]
include = ["wesep*"]
